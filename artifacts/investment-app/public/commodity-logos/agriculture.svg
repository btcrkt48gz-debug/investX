<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a27"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="url(#sky)"/>
  <!-- Ground -->
  <ellipse cx="60" cy="98" rx="40" ry="8" fill="#2d5a27"/>
  <!-- Wheat stalk left -->
  <line x1="38" y1="96" x2="38" y2="55" stroke="#c8962e" stroke-width="2.5"/>
  <ellipse cx="38" cy="50" rx="5" ry="10" fill="#f5a623" transform="rotate(-15,38,50)"/>
  <ellipse cx="33" cy="58" rx="4" ry="8" fill="#e8951a" transform="rotate(20,33,58)"/>
  <ellipse cx="43" cy="58" rx="4" ry="8" fill="#e8951a" transform="rotate(-20,43,58)"/>
  <!-- Wheat stalk center -->
  <line x1="60" y1="96" x2="60" y2="42" stroke="#c8962e" stroke-width="3"/>
  <ellipse cx="60" cy="36" rx="6" ry="13" fill="#f5a623" transform="rotate(0,60,36)"/>
  <ellipse cx="53" cy="46" rx="5" ry="10" fill="#e8951a" transform="rotate(20,53,46)"/>
  <ellipse cx="67" cy="46" rx="5" ry="10" fill="#e8951a" transform="rotate(-20,67,46)"/>
  <!-- Wheat stalk right -->
  <line x1="82" y1="96" x2="82" y2="55" stroke="#c8962e" stroke-width="2.5"/>
  <ellipse cx="82" cy="50" rx="5" ry="10" fill="#f5a623" transform="rotate(15,82,50)"/>
  <ellipse cx="77" cy="58" rx="4" ry="8" fill="#e8951a" transform="rotate(20,77,58)"/>
  <ellipse cx="87" cy="58" rx="4" ry="8" fill="#e8951a" transform="rotate(-20,87,58)"/>
  <!-- Sun -->
  <circle cx="88" cy="28" r="9" fill="#fcd34d" opacity="0.8"/>
</svg>
