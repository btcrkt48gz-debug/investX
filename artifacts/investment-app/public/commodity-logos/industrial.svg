<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="50%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="24" fill="#111827"/>
  <!-- Gear outer -->
  <g transform="translate(60,60)">
    <!-- Teeth -->
    <rect x="-6" y="-36" width="12" height="14" rx="2" fill="url(#metal)"/>
    <rect x="-6" y="22" width="12" height="14" rx="2" fill="url(#metal)"/>
    <rect x="22" y="-6" width="14" height="12" rx="2" fill="url(#metal)"/>
    <rect x="-36" y="-6" width="14" height="12" rx="2" fill="url(#metal)"/>
    <rect x="13" y="-30" width="12" height="14" rx="2" fill="url(#metal)" transform="rotate(45,19,-23)"/>
    <rect x="-25" y="-30" width="12" height="14" rx="2" fill="url(#metal)" transform="rotate(-45,-19,-23)"/>
    <rect x="13" y="16" width="12" height="14" rx="2" fill="url(#metal)" transform="rotate(-45,19,23)"/>
    <rect x="-25" y="16" width="12" height="14" rx="2" fill="url(#metal)" transform="rotate(45,-19,23)"/>
    <!-- Main circle -->
    <circle r="26" fill="url(#metal)"/>
    <!-- Inner circle -->
    <circle r="14" fill="url(#inner)"/>
    <!-- Center hole -->
    <circle r="7" fill="#111827"/>
    <!-- Shine -->
    <circle r="26" fill="white" opacity="0.04"/>
    <path d="M-18,-18 A26,26 0 0,1 18,-18" stroke="white" stroke-width="3" fill="none" opacity="0.15" stroke-linecap="round"/>
  </g>
</svg>
